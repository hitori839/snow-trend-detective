<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Snow Trend Detective logo">
  <!-- Snow Trend Detective — a snowflake under a magnifying glass; upper arms light snow (ice blue), lower arms heavy snow (violet). AI-assisted design (Claude). -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1c3354"/><stop offset=".6" stop-color="#0f1d33"/><stop offset="1" stop-color="#0a1424"/>
    </radialGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef0c4" stop-opacity="0"/><stop offset=".35" stop-color="#7ef0c4" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#b39dff" stop-opacity=".5"/><stop offset="1" stop-color="#b39dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af5d2"/><stop offset="1" stop-color="#7ef0c4"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/><stop offset=".45" stop-color="#9ad7ff"/><stop offset="1" stop-color="#b39dff"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="222" cy="214" r="128"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#7ef0c4" stroke-opacity=".25" stroke-width="3"/>
  <!-- aurora band -->
  <path d="M40 170 C150 90 330 70 470 140" fill="none" stroke="url(#aur)" stroke-width="26" stroke-linecap="round" opacity=".75"/>
  <path d="M60 200 C170 130 320 120 455 175" fill="none" stroke="url(#aur)" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <!-- lens glass -->
  <circle cx="222" cy="214" r="128" fill="#0b1628" fill-opacity=".55"/>
  <g clip-path="url(#lens)" opacity=".18"><path d="M94 300 C150 250 230 250 350 210" stroke="#eaf2ff" stroke-width="2" fill="none"/></g>
  <!-- snowflake -->
  <g transform="translate(222 214)" stroke-linecap="round" fill="none">
    <!-- light arms (top half): thin, ice blue -->
    <g stroke="#dff2ff" stroke-width="9">
      <line x1="0" y1="0" x2="0" y2="-92"/><line x1="0" y1="-52" x2="-22" y2="-72"/><line x1="0" y1="-52" x2="22" y2="-72"/>
      <g transform="rotate(-60)"><line x1="0" y1="0" x2="0" y2="-92"/><line x1="0" y1="-52" x2="-22" y2="-72"/><line x1="0" y1="-52" x2="22" y2="-72"/></g>
      <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-92"/><line x1="0" y1="-52" x2="-22" y2="-72"/><line x1="0" y1="-52" x2="22" y2="-72"/></g>
    </g>
    <!-- heavy arms (bottom half): thick, violet, ending in water drops -->
    <g stroke="#b39dff" stroke-width="15">
      <line x1="0" y1="0" x2="0" y2="74"/>
      <g transform="rotate(120)"><line x1="0" y1="0" x2="0" y2="-74"/></g>
      <g transform="rotate(-120)"><line x1="0" y1="0" x2="0" y2="-74"/></g>
    </g>
    <g fill="#b39dff" stroke="none">
      <path d="M0 76 C-11 92 -13 100 -13 106 A13 13 0 0 0 13 106 C13 100 11 92 0 76 Z"/>
      <g transform="rotate(120)"><path d="M0 -76 C-11 -92 -13 -100 -13 -106 A13 13 0 0 1 13 -106 C13 -100 11 -92 0 -76 Z"/></g>
      <g transform="rotate(-120)"><path d="M0 -76 C-11 -92 -13 -100 -13 -106 A13 13 0 0 1 13 -106 C13 -100 11 -92 0 -76 Z"/></g>
    </g>
    <circle r="14" fill="#eaf2ff" stroke="none"/>
  </g>
  <!-- lens ring + handle -->
  <circle cx="222" cy="214" r="128" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <circle cx="222" cy="214" r="112" fill="none" stroke="#7ef0c4" stroke-opacity=".25" stroke-width="3"/>
  <line x1="318" y1="310" x2="410" y2="402" stroke="#7ef0c4" stroke-width="40" stroke-linecap="round"/>
  <line x1="318" y1="310" x2="410" y2="402" stroke="#0b1628" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
  <!-- trend tick: rising line on the handle side -->
  <polyline points="96,430 150,412 196,420 248,392 296,384" fill="none" stroke="#b39dff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <circle cx="296" cy="384" r="9" fill="#b39dff"/>
</svg>
